<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="100%" height="100%">
  <!-- Circular Credito Indigo / Violet Badge -->
  <circle cx="60" cy="60" r="58" fill="#1E1B4B" stroke="#6366F1" stroke-width="2.5"/>
  <circle cx="60" cy="60" r="52" fill="#312E81" stroke="#818CF8" stroke-width="0.8" stroke-dasharray="3,2"/>
  
  <!-- Credit / Customer / Ledger Icon Graphic -->
  <g transform="translate(60, 52)">
    <!-- Ledger Sheet -->
    <rect x="-26" y="-22" width="52" height="38" rx="4" fill="#EEF2FF" stroke="#4338CA" stroke-width="1.5"/>
    <line x1="-18" y1="-12" x2="10" y2="-12" stroke="#6366F1" stroke-width="2" stroke-linecap="round"/>
    <line x1="-18" y1="-4" x2="18" y2="-4" stroke="#818CF8" stroke-width="1.5" stroke-linecap="round"/>
    <line x1="-18" y1="4" x2="6" y2="4" stroke="#818CF8" stroke-width="1.5" stroke-linecap="round"/>
    
    <!-- Stamp / Approved Badge -->
    <circle cx="16" cy="10" r="13" fill="#4F46E5" stroke="#FFFFFF" stroke-width="1.5"/>
    <path d="M12 10 L15 13 L21 7" fill="none" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
  
  <!-- Text Label -->
  <text x="60" y="103" text-anchor="middle" fill="#C7D2FE" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="800" letter-spacing="1">CRÉDITO</text>
</svg>
