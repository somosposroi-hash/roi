<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="100%" height="100%">
  <!-- White circular background with crisp subtle border matching user's Pago Movil image -->
  <circle cx="60" cy="60" r="58" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="2.5"/>
  
  <!-- Venezuelan Pago Movil Emblem (Dynamic triangular folded origami badge) -->
  <g transform="translate(60, 60) scale(0.95)">
    <!-- Yellow facet (left) -->
    <path d="M -26 -16 C -28 -21 -25 -25 -19 -28 L 0 -38 C 2 -39 4 -38 5 -36 L -2 -3 C -3 -1 -5 0 -7 0 L -23 4 C -28 5 -30 2 -29 -3 Z" fill="#F8B318" />
    
    <!-- Blue central triangular facet (center/bottom) -->
    <path d="M -5 6 L 6 -32 C 8 -30 9 -28 9 -25 L 14 6 C 14 9 12 11 9 11 L -2 11 C -5 11 -6 9 -5 6 Z" fill="#0066B3" />
    
    <!-- Red facet (right) -->
    <path d="M 14 -28 C 19 -30 24 -27 27 -22 L 34 2 C 36 8 33 13 27 16 L 16 22 C 12 24 9 22 8 18 L 10 -22 C 10 -25 12 -27 14 -28 Z" fill="#E31B23" />
  </g>

  <!-- Canonical Pago Movil Vector Accurate Polygons -->
  <g transform="translate(60, 59) scale(0.68)">
    <!-- Left Yellow Origami Wing -->
    <polygon points="-36,-10 -6,-38 2,12 -28,34" fill="#FBBF24" />
    <path d="M -36,-10 L -6,-38 C -3,-41 2,-39 3,-35 L 2,12 C 2,16 -2,18 -5,17 L -28,34 C -34,38 -40,32 -38,26 Z" fill="#F59E0B" />
    
    <!-- Center Royal Blue Diamond Segment -->
    <polygon points="5,-32 18,-18 7,38 -6,14" fill="#0284C7" />
    <path d="M 5,-32 L 18,-18 C 20,-16 20,-12 18,-9 L 7,38 C 5,42 0,42 -2,38 L -6,14 Z" fill="#0369A1" />

    <!-- Right Vivid Red Wing -->
    <polygon points="20,-16 42,4 28,40 10,36" fill="#EF4444" />
    <path d="M 20,-16 L 42,4 C 46,7 46,13 43,17 L 28,40 C 25,44 19,43 17,39 L 10,36 Z" fill="#DC2626" />
  </g>
</svg>
