<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="100%" height="100%">
  <!-- Circular banknote background with security guilloche border -->
  <circle cx="60" cy="60" r="58" fill="#143422" stroke="#2D6A4F" stroke-width="2.5"/>
  <circle cx="60" cy="60" r="52" fill="#1B4332" stroke="#40916C" stroke-width="1" stroke-dasharray="3,2"/>
  
  <!-- US Dollar Stacked Banknotes Pattern -->
  <g transform="translate(60, 56)">
    <!-- Bottom banknote tilted -->
    <rect x="-42" y="-22" width="84" height="46" rx="3" fill="#2D6A4F" stroke="#74C69D" stroke-width="1" transform="rotate(-6)"/>
    <!-- Middle banknote tilted opposite -->
    <rect x="-42" y="-22" width="84" height="46" rx="3" fill="#40916C" stroke="#95D5B2" stroke-width="1" transform="rotate(4)"/>
    <!-- Top primary banknote -->
    <rect x="-40" y="-22" width="80" height="44" rx="3" fill="#D8F3DC" stroke="#2D6A4F" stroke-width="1.5"/>
    <rect x="-37" y="-19" width="74" height="38" rx="2" fill="none" stroke="#52B788" stroke-width="0.8" stroke-dasharray="2,1"/>
    
    <!-- Central Oval Vignette with $ -->
    <ellipse cx="0" cy="0" rx="16" ry="14" fill="#B7E4C7" stroke="#2D6A4F" stroke-width="1.2"/>
    <text x="0" y="6" text-anchor="middle" fill="#1B4332" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, serif" font-size="20" font-weight="900">$</text>
    
    <!-- Corner Denominations -->
    <text x="-32" y="-10" text-anchor="middle" fill="#1B4332" font-family="monospace" font-size="7" font-weight="bold">$</text>
    <text x="32" y="14" text-anchor="middle" fill="#1B4332" font-family="monospace" font-size="7" font-weight="bold">$</text>
  </g>

  <!-- Bottom banner badge "USD CASH" -->
  <rect x="25" y="90" width="70" height="18" rx="9" fill="#081C15" stroke="#52B788" stroke-width="1"/>
  <text x="60" y="103" text-anchor="middle" fill="#D8F3DC" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="9" font-weight="800" letter-spacing="1">EFECTIVO $</text>
</svg>
