<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="100%" height="100%">
  <!-- Circular background with Venezuelan Banknote tones -->
  <circle cx="60" cy="60" r="58" fill="#4A154B" stroke="#7C3AED" stroke-width="2.5"/>
  <circle cx="60" cy="60" r="52" fill="#581C87" stroke="#C084FC" stroke-width="1" stroke-dasharray="3,2"/>
  
  <!-- Fan of Banknotes in official Venezuelan denominations colors (Olive, Blue, Orange, Magenta) -->
  <g transform="translate(60, 50)">
    <!-- 100 Bs Magenta Banknote (Back left) -->
    <rect x="-38" y="-24" width="76" height="42" rx="3" fill="#9D174D" stroke="#F472B6" stroke-width="1" transform="rotate(-12)"/>
    <!-- 50 Bs Green Banknote (Back center) -->
    <rect x="-38" y="-24" width="76" height="42" rx="3" fill="#065F46" stroke="#34D399" stroke-width="1" transform="rotate(-4)"/>
    <!-- 20 Bs Orange/Yellow Banknote (Center) -->
    <rect x="-38" y="-24" width="76" height="42" rx="3" fill="#D97706" stroke="#FCD34D" stroke-width="1" transform="rotate(5)"/>
    <!-- 10 Bs Blue Banknote (Front) -->
    <rect x="-36" y="-20" width="72" height="40" rx="3" fill="#1E40AF" stroke="#60A5FA" stroke-width="1.2" transform="rotate(11)"/>
    
    <!-- Central Coin (1 Bolívar Digital / Soberano coin from bs.jfif) -->
    <circle cx="0" cy="4" r="19" fill="#E2E8F0" stroke="#94A3B8" stroke-width="2"/>
    <circle cx="0" cy="4" r="16" fill="#F1F5F9" stroke="#CBD5E1" stroke-width="0.8" stroke-dasharray="2,1"/>
    <text x="0" y="2" text-anchor="middle" fill="#0F172A" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="900">1</text>
    <text x="0" y="11" text-anchor="middle" fill="#475569" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="6" font-weight="800" letter-spacing="0.5">BOLÍVAR</text>
  </g>

  <!-- Bottom banner badge "BS. EFECTIVO" -->
  <rect x="23" y="90" width="74" height="18" rx="9" fill="#1E1B4B" stroke="#A855F7" stroke-width="1"/>
  <text x="60" y="103" text-anchor="middle" fill="#F3E8FF" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="9" font-weight="800" letter-spacing="1">EFECTIVO BS</text>
</svg>
