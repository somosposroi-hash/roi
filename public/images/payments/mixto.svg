<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="100%" height="100%">
  <!-- Circular Pago Mixto / Multi-currency Badge -->
  <circle cx="60" cy="60" r="58" fill="#0F172A" stroke="#0EA5E9" stroke-width="2.5"/>
  <circle cx="60" cy="60" r="52" fill="#1E293B" stroke="#38BDF8" stroke-width="0.8" stroke-dasharray="3,2"/>
  
  <!-- Split Coins / Currency Layer Graphics -->
  <g transform="translate(60, 52)">
    <!-- Dollar coin (left) -->
    <circle cx="-16" cy="-4" r="18" fill="#15803D" stroke="#86EFAC" stroke-width="1.8"/>
    <text x="-16" y="3" text-anchor="middle" fill="#FFFFFF" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="18" font-weight="900">$</text>
    
    <!-- Bolivar coin (right overlapping) -->
    <circle cx="16" cy="4" r="18" fill="#7E22CE" stroke="#D8B4FE" stroke-width="1.8"/>
    <text x="16" y="10" text-anchor="middle" fill="#FFFFFF" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="900">Bs</text>
    
    <!-- Shuffle / Exchange arrows in center -->
    <circle cx="0" cy="0" r="10" fill="#0284C7" stroke="#FFFFFF" stroke-width="1.2"/>
    <path d="M-4 -2 L4 -2 M1 -5 L4 -2 L1 1" fill="none" stroke="#FFFFFF" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M4 2 L-4 2 M-1 5 L-4 2 L-1 -1" fill="none" stroke="#FFFFFF" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
  
  <!-- Text Label -->
  <text x="60" y="103" text-anchor="middle" fill="#38BDF8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10" font-weight="800" letter-spacing="1">PAGO MIXTO</text>
</svg>
