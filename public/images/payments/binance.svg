<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="100%" height="100%">
  <!-- Circular Binance Black & Gold Background -->
  <circle cx="60" cy="60" r="58" fill="#181A20" stroke="#F0B90B" stroke-width="2.5"/>
  <circle cx="60" cy="60" r="52" fill="#0B0E11" stroke="#F3BA2F" stroke-width="0.8" stroke-dasharray="3,2"/>
  
  <!-- Binance Iconic Diamond Logo Shapes -->
  <g fill="#F0B90B">
    <!-- Center Diamond -->
    <polygon points="60,45 70,55 60,65 50,55" />
    
    <!-- Top Diamond / Chevron -->
    <polygon points="60,26 69,35 63,41 60,38 57,41 51,35" />
    
    <!-- Bottom Diamond / Chevron -->
    <polygon points="60,84 69,75 63,69 60,72 57,69 51,75" />
    
    <!-- Left Diamond / Chevron -->
    <polygon points="31,55 40,46 46,52 43,55 46,58 40,64" />
    
    <!-- Right Diamond / Chevron -->
    <polygon points="89,55 80,46 74,52 77,55 74,58 80,64" />
  </g>
  
  <!-- Text Label -->
  <text x="60" y="103" text-anchor="middle" fill="#F0B90B" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="900" letter-spacing="1.5">BINANCE</text>
</svg>
