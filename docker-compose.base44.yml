services:
  app:
    image: node:22-slim
    working_dir: /app
    volumes:
      - ./:/app
    ports:
      - "3000:3000"
    env_file:
      - /run/base44/app.env
    environment:
      - NODE_ENV=development
      - CHOKIDAR_USEPOLLING=true
      - __VITE_ADDITIONAL_SERVER_ALLOWED_HOSTS
    command: ["sh", "-ec", "npm ci && npx prisma generate && exec npx tsx server.ts"]
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3000/api/health').then(r=>r.ok?process.exit(0):process.exit(1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 120s
    restart: on-failure
